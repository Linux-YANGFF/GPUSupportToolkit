name: GST CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-backend:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gst
    strategy:
      matrix:
        go-version: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -cover ./...

      - name: go build
        run: go build ./cmd/...
